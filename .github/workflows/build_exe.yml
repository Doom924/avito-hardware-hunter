name: Build AvitoHunter.exe

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity check (import module)
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('avito_hunter_gui.py').read_text(encoding='utf-8')); print('OK')"

      - name: Build EXE (PyInstaller)
        run: |
          pyinstaller --noconfirm --onefile --windowed             --name AvitoHunter             --collect-all customtkinter             --collect-all playwright             --collect-all openpyxl             --hidden-import gpu_bench             avito_hunter_gui.py

      - name: Verify artifact
        run: |
          if (!(Test-Path "dist\AvitoHunter.exe")) { throw "EXE not found" }
          Get-Item "dist\AvitoHunter.exe" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvitoHunter-windows
          path: dist/AvitoHunter.exe
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AvitoHunter.exe